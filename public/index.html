<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Matu Game 1</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
    body {
      background: #0a0a1a;
      color: #fff;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      overflow: hidden;
    }

    /* Lobby */
    #lobby { text-align: center; padding: 1rem; }
    h1 { font-size: clamp(1.5rem, 6vw, 2.5rem); margin-bottom: 2rem; color: #7af; }
    button {
      background: #1a3a6a;
      color: #fff;
      border: 2px solid #7af;
      padding: 0.75rem 2rem;
      font-size: clamp(0.9rem, 4vw, 1rem);
      font-family: monospace;
      cursor: pointer;
      margin: 0.5rem;
      border-radius: 4px;
    }
    button:hover, button:active { background: #2a5a9a; }
    input {
      background: #111;
      color: #fff;
      border: 2px solid #7af;
      padding: 0.75rem 1rem;
      font-size: clamp(1rem, 5vw, 1.2rem);
      font-family: monospace;
      text-align: center;
      border-radius: 4px;
      width: min(200px, 80vw);
      text-transform: uppercase;
    }
    #room-code { font-size: clamp(1.2rem, 6vw, 2rem); color: #7af; letter-spacing: 0.2rem; margin: 1rem 0; }
    #status { color: #aaa; margin-top: 1rem; }

    /* Game wrapper */
    #game-wrapper {
      display: none;
      position: relative;
      width: 100%;
      height: 100dvh;
      align-items: center;
      justify-content: center;
    }
    #game-wrapper.active { display: flex; }

    canvas {
      display: block;
      image-rendering: pixelated;
    }

    /* Touch controls */
    #touch-controls {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
    }
    #touch-controls.active { display: block; }

    .touch-btn {
      position: absolute;
      background: rgba(100, 170, 255, 0.15);
      border: 2px solid rgba(100, 170, 255, 0.4);
      border-radius: 12px;
      color: rgba(255,255,255,0.6);
      font-size: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: all;
      user-select: none;
      -webkit-user-select: none;
    }
    .touch-btn:active { background: rgba(100, 170, 255, 0.35); }

    #btn-up    { left: 3%; top: 10%; width: 18%; height: 35%; }
    #btn-down  { left: 3%; bottom: 10%; width: 18%; height: 35%; }
    #btn-shoot { right: 3%; top: 25%; width: 22%; height: 50%; font-size: 2.5rem; }
  </style>
</head>
<body>

  <!-- Lobby -->
  <div id="lobby">
    <h1>🚀 MATU GAME 1</h1>

    <div id="screen-main">
      <button onclick="createRoom()">CREATE GAME</button>
      <br/>
      <button onclick="showJoin()">JOIN GAME</button>
    </div>

    <div id="screen-join" style="display:none">
      <input id="room-input" placeholder="ENTER CODE" maxlength="12" />
      <br/><br/>
      <button onclick="joinRoom()">JOIN</button>
    </div>

    <div id="screen-wait" style="display:none">
      <p>Share this code with your friend:</p>
      <div id="room-code"></div>
      <p id="status">Waiting for player 2...</p>
    </div>
  </div>

  <!-- Game -->
  <div id="game-wrapper">
    <canvas id="canvas" width="800" height="600"></canvas>
    <div id="touch-controls">
      <div class="touch-btn" id="btn-up">▲</div>
      <div class="touch-btn" id="btn-down">▼</div>
      <div class="touch-btn" id="btn-shoot">🚀</div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
